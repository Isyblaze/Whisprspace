name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -q whisprspace.zip
          cp -r whisprspace/. .
          rm -rf whisprspace
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffold
        run: flutter create . --platforms=android --org app.whisprspace --project-name whisprspace
      - name: Permissions, app name, min SDK
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in RECORD_AUDIO INTERNET MODIFY_AUDIO_SETTINGS ACCESS_NETWORK_STATE ACCESS_COARSE_LOCATION; do
            sed -i "s|<application|<uses-permission android:name=\"android.permission.$p\"/><application|" $M
          done
          sed -i 's|android:label="[^"]*"|android:label="WhisprSpace"|' $M
          sed -i -E 's/minSdk(Version)?( =)? flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle*
      - name: Fetch NASA Blue Marble (public domain)
        run: |
          mkdir -p assets
          for u in \
            "https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57752/land_shallow_topo_2048.jpg" \
            "http://veimages.gsfc.nasa.gov/2433/land_shallow_topo_2048.jpg" \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Land_shallow_topo_2048.jpg"; do
            if curl -fsSL --retry 2 -A "Mozilla/5.0" "$u" -o assets/earth.jpg && [ "$(stat -c%s assets/earth.jpg)" -gt 100000 ]; then break; fi
            rm -f assets/earth.jpg
          done
          test -f assets/earth.jpg || { echo "Could not download the Earth texture"; exit 1; }
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: whisprspace-apk
          path: build/app/outputs/flutter-apk/app-release.apk
